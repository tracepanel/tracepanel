name: npm

# The agent's npm packages: the 15 platform packages and @tracepanel/agent, which depends on them.
#
# - After a release (release.yml, on a version tag) publishes to PyPI: it publishes the npm packages that release made
#   from the same wheels (wheels.yml builds them once). The binaries on npm are the ones on PyPI, byte for byte.
# - By hand, with a version already on PyPI (0.0.1a1): it downloads that release's wheels, makes the packages from
#   them, checks them, and publishes them. The binaries are the ones on PyPI, byte for byte.
#
# A maintainer approves a release once, when Release publishes it to PyPI (its pypi environment): this runs only
# after that run succeeded, and publishes what it built.
#
# npm's trusted publishing signs the upload, with no token: each package trusts this repository, npm.yml and the
# environment npm, and nothing else can publish it. An NPM_TOKEN secret, if set, is used instead.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "A version on PyPI, such as 0.0.1a1: its wheels go to npm unchanged"
        required: true

permissions:
  contents: read

jobs:
  released:
    # A released version's wheels from PyPI, made into packages, installed and run here.
    name: Packages of ${{ inputs.version }} from PyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: The release's wheels, made into packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          uv run --no-project scripts/npm.py --download "$VERSION" wheels
          uv run --no-project scripts/npm.py wheels npm

      - name: Pack them
        run: |
          mkdir npm-dist
          for package in npm/*/; do (cd "$package" && npm pack --pack-destination ../../npm-dist); done

      - name: Install, run the command, receive a trace and serve it
        run: |
          mkdir try && cd try && npm init -y > /dev/null
          npm install --omit=optional ../npm-dist/tracepanel-agent-[0-9]*.tgz ../npm-dist/tracepanel-agent-linux-x64-gnu-*.tgz
          npx tracepanel-agent --version
          export TRACEPANEL_AGENT_BIN="$(node -p "require('@tracepanel/agent').binaryPath()")"
          cd .. && uv run --no-project --python 3.13 python scripts/smoke.py

      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm-dist/*.tgz

  publish:
    name: Publish to npm
    needs: released
    # A release published to PyPI from a tag, or the packages made here by hand from a version on PyPI.
    if: >-
      ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@tracepanel/agent
    permissions:
      # What npm's trusted publishing and provenance sign the upload with, in place of a token.
      id-token: write
      # The release's run, to download its npm packages.
      actions: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install --global npm@^11.15.0

      - name: The release's packages
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: The packages made here
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-dist

      - name: Publish the platform packages, then @tracepanel/agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # "./": npm reads a bare "dir/file" as a GitHub repository, not a file.
          main=$(ls ./npm-dist/tracepanel-agent-[0-9]*.tgz)
          version=$(basename "$main" .tgz)
          version=${version#tracepanel-agent-}
          # A pre-release goes under its own dist-tag (alpha, beta, rc), so `npm install` keeps the latest release.
          case "$version" in
            *-*) tag=$(echo "${version#*-}" | cut -d. -f1) ;;
            *) tag=latest ;;
          esac
          echo "version $version, dist-tag $tag"
          # A package already on npm is left as it is: a run started again after a failure publishes the rest.
          publish() {
            name=$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm already"
            else
              npm publish "$1" --access public --tag "$tag" --provenance
            fi
          }
          for package in ./npm-dist/*.tgz; do
            [ "$package" = "$main" ] && continue
            publish "$package"
          done
          # Last: once it is public, installing it needs the platform packages.
          publish "$main"
          echo "::notice::$version is on npm"
