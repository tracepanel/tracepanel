name: CI

# One workflow for every change: `changes` reads what the change touched, and each check runs only when its part did
# (the Rust when the crates or what they embed changed, the UI when ui/ did, the docs when a page or a comment did).
# A check with nothing to check is skipped, and `CI` at the end passes when every check passed or was skipped: it is
# the one check main's protection requires. A merge to main that brings exactly the code its pull request's last run
# passed on (main didn't move in between) checks nothing again: that run already checked this tree.
#
# The console's behaviour is checked through its API by tracepanel-python's tests, which build this agent from its
# checkout (tracepanel-python's CI). Here: format, lints and the crates' own tests, the UI's checks (the ones the
# pre-push hook runs locally), and the console in a browser against this agent (ui/e2e, Playwright).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To find the merged pull request's last run.
      actions: read
      pull-requests: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      ui: ${{ steps.paths.outputs.ui }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request's run checks its merge with main as main was then. When it passed on the pull request's last
      # commit, and main hadn't moved since the run began, the merge on main is that tree: nothing to check again.
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
          pr=$(api "commits/$GITHUB_SHA/pulls" '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          head=$(api "pulls/$pr" '.head.sha')
          run=$(api "actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=success" \
            '.workflow_runs[0] | "\(.id) \(.run_started_at)"')
          [ -n "$run" ] && [ "$run" != "null null" ] || exit 0
          read -r id started <<< "$run"
          main_then=$(api "commits/$BEFORE" '.commit.committer.date')
          if [[ "$main_then" < "$started" ]]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "::notice::#$pr's run $id passed on this code (main was at ${BEFORE:0:7}): not checked again."
          fi

      - id: paths
        env:
          # A pull request: what it changes from its base. A push to main: what the push added.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TESTED: ${{ steps.tested.outputs.same }}
        run: |
          everything() { for part in rust ui docs; do echo "$part=true" >> "$GITHUB_OUTPUT"; done; }
          if [ "$TESTED" = "true" ]; then for part in rust ui docs; do echo "$part=false" >> "$GITHUB_OUTPUT"; done; exit 0; fi
          # Run by hand, a new branch, or a base this checkout doesn't have: check everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then everything; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          # A change to this workflow checks everything it runs.
          if echo "$files" | grep -qx '.github/workflows/ci.yml'; then everything; exit 0; fi
          touched() { if echo "$files" | grep -qE "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          # The crates, and what they embed at build time: the store's schema, the search fields, the examples.
          touched rust '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|schema/)'
          # ui/, the build it makes (ui-dist/), and what checks it: the API it is typed from (openapi.yaml and the trace schema
          # it refers to), its build script, hooks.
          touched ui '^(ui/|ui-dist/|schema/(openapi|trace\.schema)\.(yaml|json)$|scripts/(ui|notices)\.(sh|py)$|lefthook\.yml$)'
          # The pages, and the comments scripts/lint_docs.py reads (the crates' and the scripts').
          touched docs '(\.md$|^crates/.*\.rs$|^scripts/.*\.py$)'

  rust:
    name: fmt, clippy, tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The Rust in rust-toolchain.toml, with rustfmt and clippy.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  docs:
    # The pages and the comments follow the project's docs style; scripts/lint_docs.py checks what it can.
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - run: uv run --no-project --with ruff scripts/lint_docs.py

  ui:
    # The console, the panel and the widget (ui/): one install, then each check a step of its own, so a failure names
    # its reason. ui/ releases the agents only behind the same checks.
    name: UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          # fallow audit diffs a change against its base; the walk needs both ends.
          fetch-depth: 0

      # The pnpm version comes from ui/package.json's packageManager.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # scripts/ui.sh writes the UI's licenses with uv.
      - uses: astral-sh/setup-uv@v10.3.0

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci --reporter=github .

      - name: TypeScript
        run: pnpm -r typecheck

      - name: The API types match schema/openapi.yaml
        run: |
          # The script writes the file formatted (biome ignores api.gen.ts itself).
          pnpm api
          git diff --exit-code packages/ui/src/api.gen.ts || {
            echo "::error file=ui/packages/ui/src/api.gen.ts::Out of date with schema/openapi.yaml: run pnpm api in ui/ and commit."
            exit 1
          }

      - name: ui-dist is this ui/, built
        working-directory: .
        run: |
          scripts/ui.sh
          git diff --exit-code --stat ui-dist || {
            echo "::error::ui-dist/ is out of date with ui/: run scripts/ui.sh and commit."
            exit 1
          }

      # pnpm install wires the hooks (postinstall: lefthook install); this asserts the wiring, not the local hooks a
      # dev machine has. The binary is called directly: plain `pnpm exec` recurses the whole workspace on some pnpm
      # versions and then fails on a package without the bin.
      - name: lefthook is wired
        run: ./node_modules/.bin/lefthook check-install

      - name: fallow finds only what this change adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # A new tag (the release runs this) has no base: its "before" is all zeros. Then the commit before this one.
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then BASE=HEAD~1; fi
          pnpm exec fallow audit --base "$BASE"

  e2e:
    # The console in Chromium against the agent this change builds, with the UI it embeds and traces as the SDKs send
    # them: a change to either side can break what a person sees. A failure keeps Playwright's report and traces.
    name: UI e2e
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install
        working-directory: .

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --locked --bin tracepanel-agent
        working-directory: .

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Chromium for Playwright
        run: pnpm --filter @tracepanel/e2e exec playwright install --with-deps chromium

      - name: The console in a browser
        run: pnpm --filter @tracepanel/e2e e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ui/e2e/playwright-report
            ui/e2e/test-results
          retention-days: 7

  ci:
    # What main's protection requires: every check passed, or had nothing to check.
    name: CI
    needs: [changes, rust, docs, ui, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, rust, docs, ui, e2e: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success | skipped) ;; *) echo "::error::a check $result" && exit 1 ;; esac
          done
