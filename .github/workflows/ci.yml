name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The console's behaviour is checked through its API by tracepanel-python's tests, which build this agent from its
# checkout (tracepanel-python's CI). Here: format, lints and the crates' own tests.
jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The Rust in rust-toolchain.toml, with rustfmt and clippy.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  docs:
    # The pages and the comments follow the style in .claude/skills/docs/SKILL.md.
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - run: uv run --no-project --with ruff scripts/lint_docs.py
