# The console, the panel and the widget (ui/): the checks are separate jobs so
# a failure names its reason, and the checks here are what the pre-push hook
# runs locally (ui/ releases the agents only behind the same gates).
name: UI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ui

jobs:
  lint:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from ui/package.json's packageManager.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome ci --reporter=github .

  types:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: The API types match schema/openapi.yaml
        run: |
          # The script writes the file formatted (biome ignores api.gen.ts itself).
          pnpm api
          git diff --exit-code packages/ui/src/api.gen.ts || {
            echo "::error file=ui/packages/ui/src/api.gen.ts::Out of date with schema/openapi.yaml: run pnpm api in ui/ and commit."
            exit 1
          }

  embed:
    name: ui-dist is this ui/, built
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # scripts/ui.sh writes the UI's licenses with uv.
      - uses: astral-sh/setup-uv@v10.3.0

      - run: pnpm install --frozen-lockfile

      - name: The build is reproducible
        working-directory: .
        run: |
          scripts/ui.sh
          git diff --exit-code --stat ui-dist || {
            echo "::error::ui-dist/ is out of date with ui/: run scripts/ui.sh and commit."
            exit 1
          }

  quality:
    name: fallow quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # fallow audit diffs a change against its base; the walk needs both ends.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # pnpm install wires the hooks (postinstall: lefthook install); this
      # asserts the wiring, not the local hooks a dev machine has. The binary
      # is called directly: plain `pnpm exec` recurses the whole workspace on
      # some pnpm versions and then fails on a package without the bin.
      - name: lefthook is wired
        working-directory: ui
        run: ./node_modules/.bin/lefthook check-install

      - name: fallow finds only what this change adds
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=${PR_BASE:-HEAD~1}
          pnpm exec fallow audit --base "$BASE"
