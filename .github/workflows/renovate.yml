# Renovate (self-hosted) walks ui/ dependencies on its schedule and opens the
# update PRs; the config is renovate.json5. The token is a repository secret
# (RENOVATE_TOKEN), a fine-grained PAT for this repository with contents write
# and pull request write.
name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: renovatebot/github-action@v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json5
