name: Release

# A tag that names a version (X.Y.Z, as in pyproject.toml and Cargo.toml) publishes it to PyPI. Nothing else does.
# Wheels builds and checks every platform's wheel and the sdist; this publishes them, by trusted publishing: the
# publisher on PyPI names this repository, release.yml and the environment pypi.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  version:
    # One version three ways: the tag (0.0.1a1), pyproject.toml (PEP 440: 0.0.1a1), Cargo.toml (semver:
    # 0.0.1-alpha.1). Compared as versions, before anything is built.
    name: The tag is the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - run: |
          uv run --no-project --with packaging python - <<'EOF'
          import os, sys, tomllib
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"]
          python = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          cargo = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          if not Version(tag) == Version(python) == Version(cargo):
              sys.exit(f"::error::tag {tag}, pyproject.toml {python}, Cargo.toml {cargo}: they must agree")
          print(f"version {Version(python)}")
          EOF

  # Nothing is built or published before CI has passed on the tagged commit: the run that main's push made, not a new
  # one.
  ci:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "$result" in
              "completed success") echo "CI passed on $GITHUB_SHA" && exit 0 ;;
              completed*) echo "::error::CI on $GITHUB_SHA: $result" && exit 1 ;;
              # No run of main on this commit: tag a commit of main, after its CI.
              "null null") [ "$attempt" -ge 10 ] && echo "::error::no CI run of main on $GITHUB_SHA" && exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::CI on $GITHUB_SHA still runs" && exit 1

  wheels:
    needs: [version, ci]
    uses: ./.github/workflows/wheels.yml

  # Signed build provenance (Sigstore, through GitHub's attestations) for every file the release ships, and for the
  # agent's binary of each platform on its own: the same bytes pip, npm and the Java SDK install. Anyone checks one with
  # `gh attestation verify FILE --repo tracepanel/tracepanel`. Nothing is published without it.
  attest:
    name: Attest the build
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: The binaries, out of the npm platform packages
        run: |
          mkdir binaries
          for package in dist/tracepanel-agent-*.tgz; do
            unpacked=$(mktemp -d)
            tar -xzf "$package" -C "$unpacked"
            # @tracepanel/agent itself holds the launcher, not a binary.
            platform=$(jq -r '.name | select(startswith("@tracepanel/agent-")) | ltrimstr("@tracepanel/agent-")' \
              "$unpacked/package/package.json")
            [ -n "$platform" ] || continue
            for binary in "$unpacked"/package/bin/*; do
              case "$binary" in
                *.exe) cp "$binary" "binaries/tracepanel-agent-$platform.exe" ;;
                *) cp "$binary" "binaries/tracepanel-agent-$platform" ;;
              esac
            done
          done
          ls -l binaries
          [ "$(ls binaries | wc -l)" -ge 15 ] || { echo "::error::fewer than 15 binaries" && exit 1; }

      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tgz
            binaries/*

      - name: Each binary verifies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for binary in binaries/*; do
            gh attestation verify "$binary" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" > /dev/null
            echo "verified $binary"
          done

  publish:
    name: Publish to PyPI
    needs: [wheels, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tracepanel-agent/
    permissions:
      # What PyPI's trusted publishing signs the upload with, in place of a token.
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # PEP 740 attestations, signed with this job's identity, the one PyPI's trusted publisher names: PyPI shows each
      # file's provenance and pip can check it. uv publish uploads them beside their files.
      - name: Sign for PyPI
        run: uvx --from pypi-attestations==0.0.30 pypi-attestations sign dist/*.whl dist/*.tar.gz

      - name: Publish
        # Wheels and the sdist only: the run also holds the npm packages (.tgz), which npm.yml stages once this run
        # succeeds, the same build on both registries.
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz

  # The release on GitHub, after the registry took it: its notes are the changelog's entry for the version.
  github:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v head="## $GITHUB_REF_NAME " 'index($0, head) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no entry for $GITHUB_REF_NAME" && exit 1; fi
          case "$GITHUB_REF_NAME" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*|*-*) pre=--prerelease ;;
            *) pre= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $pre
