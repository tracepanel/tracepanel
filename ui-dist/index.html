<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracepanel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='6' width='26' height='5.5' rx='2.75' fill='%237c4ff0'/><rect x='9' y='13.25' width='18' height='5.5' rx='2.75' fill='%23a587ff'/><rect x='15' y='20.5' width='10' height='5.5' rx='2.75' fill='%23b6e24a'/></svg>" />
    <script id="tracepanel-theme">
      // The theme before the first paint, as theme.ts sets it: the stored choice, dark when there is none.
      (() => {
        let choice = null;
        try {
          choice = localStorage.getItem("tracepanel:theme");
        } catch {}
        const light =
          choice === "light" || (choice === "system" && !matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
    <script type="module" crossorigin src="./tracepanel.min.js?v=98aef5bc4f"></script>
    <link rel="stylesheet" crossorigin href="./tracepanel.min.css?v=22e1c40c02">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
