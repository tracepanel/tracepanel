# cargo about: the licenses of the open source crates compiled into the agent (scripts/notices.sh).
# A crate under a license not listed here fails the notices: look at it before adding the license.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "MPL-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# This workspace's own crates (publish = false): under LICENSE.
private = { ignore = true }
