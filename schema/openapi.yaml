openapi: 3.1.0
info:
  title: tracepanel local API
  version: "0.1"
  description: |
    The JSON API the Tracepanel console and widget read, served by the agent (and under /__tracepanel__/api/ by
    apps, which forward it to the agent). This file is the contract: the agent's and the Python SDK's tests check
    responses against it, and the UI (ui/) generates its client types from it.

    Times are Unix epoch microseconds (UTC); durations are microseconds. Lists that grow (traces, logs,
    mails) page with a cursor: pass the previous response's `next` as `before`.
servers:
  - url: /__tracepanel__/api
paths:
  /traces:
    get:
      operationId: searchTraces
      summary: Traces matching a search, newest first.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/before"
        - name: ids
          in: query
          description: Comma-separated trace ids; returns just those (the widget's tab history).
          schema: { type: string }
      responses:
        "200":
          description: One page of traces.
          content:
            application/json:
              schema:
                type: object
                required: [traces, next]
                additionalProperties: false
                properties:
                  traces: { type: array, items: { $ref: "#/components/schemas/TraceSummary" } }
                  next: { $ref: "#/components/schemas/Cursor" }
        "400": { $ref: "#/components/responses/BadSearch" }
  /traces/{id}:
    get:
      operationId: getTrace
      summary: One trace with its spans, logs, errors and issues.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9A-Z]{26}$" }
      responses:
        "200":
          description: The trace document.
          content:
            application/json:
              schema: { $ref: "trace.schema.json" }
        "404": { $ref: "#/components/responses/NotFound" }
  /traces/{id}/related:
    get:
      operationId: relatedTraces
      summary: "Traces linked to this one, by kind: task enqueues, WebSocket connections, channel layer messages."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9A-Z]{26}$" }
      responses:
        "200":
          description: Linked traces; empty when there are none (or the trace is unknown).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Related" }
  /snapshot/{id}:
    get:
      operationId: traceSnapshot
      summary: >-
        A trace to share, with the traces linked to it and the links of each: what the console writes into a snapshot
        file, which opens without the agent.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9A-Z]{26}$" }
        - name: values
          in: query
          description: >-
            `1` keeps what otherwise stays on this machine: query parameters, mail bodies, a user's name and email, a
            log record's own fields and the local variables of errors.
          schema: { type: string, enum: ["0", "1"], default: "0" }
      responses:
        "200":
          description: The snapshot's data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404": { $ref: "#/components/responses/NotFound" }
  /traces/overview:
    get:
      operationId: tracesOverview
      summary: Monitoring over every trace matching a search, grouped into operations (kind + name).
      parameters:
        - $ref: "#/components/parameters/q"
        - name: group
          in: query
          description: >-
            How the slowest and failing lists group traces: `operation` (kind + name: a GraphQL operation, a task) or
            `endpoint` (an HTTP request by method + route, so all GraphQL operations are one `POST /graphql/`).
          schema: { type: string, enum: [operation, endpoint], default: operation }
      responses:
        "200":
          description: Summary, time series and worst endpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TracesOverview" }
        "400": { $ref: "#/components/responses/BadSearch" }
  /logs:
    get:
      operationId: searchLogs
      summary: Log records matching a search, newest first.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/before"
      responses:
        "200":
          description: One page of log records.
          content:
            application/json:
              schema:
                type: object
                required: [logs, next]
                additionalProperties: false
                properties:
                  logs: { type: array, items: { $ref: "#/components/schemas/LogRow" } }
                  next: { $ref: "#/components/schemas/Cursor" }
        "400": { $ref: "#/components/responses/BadSearch" }
  /mails:
    get:
      operationId: searchMails
      summary: Sent emails matching a search, newest first.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/before"
      responses:
        "200":
          description: One page of emails.
          content:
            application/json:
              schema:
                type: object
                required: [mails, next]
                additionalProperties: false
                properties:
                  mails: { type: array, items: { $ref: "#/components/schemas/MailRow" } }
                  next: { $ref: "#/components/schemas/Cursor" }
        "400": { $ref: "#/components/responses/BadSearch" }
  /calls:
    get:
      operationId: listCalls
      summary: >-
        Calls the app made to other systems (SQL, Redis, cache, HTTP, a datastore, a broker, an RPC system) aggregated
        per key across stored traces, heaviest first. One list for every system; `system` narrows it to one, as
        `system:` in q does.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
        - name: system
          in: query
          description: "One system, as /counts lists them: sql, redis, cache, http, mongodb, kafka, grpc, neo4j…"
          schema: { type: string }
      responses:
        "200":
          description: Calls.
          content:
            application/json:
              schema:
                type: object
                required: [calls]
                additionalProperties: false
                properties:
                  calls: { type: array, items: { $ref: "#/components/schemas/CallRow" } }
        "400": { $ref: "#/components/responses/BadSearch" }
  /calls/summary:
    get:
      operationId: callsSummary
      summary: >-
        The calls /calls lists at a glance, over every one of them (not the top groups a list shows): the tiles above
        a system's page. The same `q` and `system`.
      parameters:
        - $ref: "#/components/parameters/q"
        - name: system
          in: query
          description: "One system, as /counts lists them."
          schema: { type: string }
      responses:
        "200":
          description: The totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallsSummary" }
        "400": { $ref: "#/components/responses/BadSearch" }
  /explain:
    get:
      operationId: explain
      summary: EXPLAIN (or EXPLAIN ANALYZE) of one captured SELECT, run on its database.
      parameters:
        - { name: trace, in: query, required: true, schema: { type: string } }
        - { name: span, in: query, required: true, schema: { type: string } }
        - name: analyze
          in: query
          description: "1 runs the query to measure it (PostgreSQL, MySQL)."
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: The query plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExplainPlan" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The query can't be explained (not a SELECT, no captured parameters, database error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /tasks:
    get:
      operationId: listTasks
      summary: Background tasks by name (Celery, Django Tasks; system names the queue), busiest first.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                additionalProperties: false
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/TaskRow" } }
        "400": { $ref: "#/components/responses/BadSearch" }
  /graphql:
    get:
      operationId: listGraphqlOperations
      summary: GraphQL operations (Strawberry) by name, with calls, errors, latency and queries, busiest first.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Operations.
          content:
            application/json:
              schema:
                type: object
                required: [graphql]
                additionalProperties: false
                properties:
                  graphql: { type: array, items: { $ref: "#/components/schemas/GraphqlRow" } }
        "400": { $ref: "#/components/responses/BadSearch" }
  /traces/summary:
    get:
      operationId: summarizeTraces
      summary: >-
        Any group of traces named by a search (task:x, operation:"query X", kind:command name:y): percentiles,
        series, histogram, issues, slowest and recent calls. Every group page in the console is one of these.
      parameters:
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceGroup" }
        "400": { $ref: "#/components/responses/BadSearch" }
        "404": { $ref: "#/components/responses/NotFound" }
  /jobs:
    get:
      operationId: listJobs
      summary: Jobs (management commands and tracepanel.trace() blocks) by name, busiest first.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                additionalProperties: false
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/JobRow" } }
        "400": { $ref: "#/components/responses/BadSearch" }
  /rpc:
    get:
      operationId: listRpcs
      summary: "RPC calls served (gRPC and other RPC systems' servers) by method, Service/Method, busiest first."
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Methods.
          content:
            application/json:
              schema:
                type: object
                required: [rpc]
                additionalProperties: false
                properties:
                  rpc: { type: array, items: { $ref: "#/components/schemas/RpcRow" } }
        "400": { $ref: "#/components/responses/BadSearch" }
  /pages:
    get:
      operationId: listPages
      summary: "Pages viewed in a browser (tracepanel-js's browser recording) by path, busiest first."
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Pages.
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                additionalProperties: false
                properties:
                  pages: { type: array, items: { $ref: "#/components/schemas/PageRow" } }
        "400": { $ref: "#/components/responses/BadSearch" }
  /ingest:
    post:
      operationId: ingestTraces
      summary: "Traces a page recorded in the browser, sent as an SDK sends them: a JSON array of traces."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { type: object } }
      responses:
        "202":
          description: Taken; the agent stores them as an SDK's.
          content:
            application/json:
              schema:
                type: object
                required: [taken]
                additionalProperties: false
                properties:
                  taken: { type: integer }
        "400":
          description: Not a JSON array of traces.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Not application/json.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /graphql/detail:
    get:
      operationId: getGraphqlOperation
      summary: One GraphQL operation, like an endpoint (percentiles, series, issues, calls), plus its resolvers.
      parameters:
        - { name: operation, in: query, required: true, schema: { type: string }, description: "query PostList" }
        - $ref: "#/components/parameters/service"
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphqlDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /websockets:
    get:
      operationId: listWebsockets
      summary: WebSocket consumers (Channels) with their connections, messages, errors and handler time, busiest first.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Consumers.
          content:
            application/json:
              schema:
                type: object
                required: [websockets]
                additionalProperties: false
                properties:
                  websockets: { type: array, items: { $ref: "#/components/schemas/WebsocketRow" } }
        "400": { $ref: "#/components/responses/BadSearch" }
  /services:
    get:
      operationId: listServices
      summary: >-
        What the project's web, workers and commands talk to (databases, caches, mail, brokers, HTTP APIs) and how
        much: the nodes and edges of a service map.
      parameters:
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Service map.
          content:
            application/json:
              schema:
                type: object
                required: [apps, links, services, edges]
                additionalProperties: false
                properties:
                  apps: { type: array, items: { $ref: "#/components/schemas/ServiceApp" } }
                  links:
                    type: array
                    description: One app calling another, most traces first.
                    items: { $ref: "#/components/schemas/AppLink" }
                  services:
                    type: array
                    description: By kind, then by total time.
                    items: { $ref: "#/components/schemas/ServiceNode" }
                  edges:
                    type: array
                    description: Most time first.
                    items: { $ref: "#/components/schemas/ServiceEdge" }
        "400": { $ref: "#/components/responses/BadSearch" }
  /endpoints:
    get:
      operationId: listEndpoints
      summary: HTTP traffic per route.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Endpoints.
          content:
            application/json:
              schema:
                type: object
                required: [endpoints]
                additionalProperties: false
                properties:
                  endpoints: { type: array, items: { $ref: "#/components/schemas/EndpointRow" } }
        "400": { $ref: "#/components/responses/BadSearch" }
  /endpoints/detail:
    get:
      operationId: getEndpoint
      summary: One endpoint with percentiles, time series, issues and calls.
      parameters:
        - { name: method, in: query, required: true, schema: { type: string } }
        - { name: route, in: query, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/service"
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndpointDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /issues:
    get:
      operationId: listIssues
      summary: Issues (errors, N+1, duplicate and slow SQL) by fingerprint, most recent first.
      parameters:
        - $ref: "#/components/parameters/q"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Issues.
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                additionalProperties: false
                properties:
                  issues: { type: array, items: { $ref: "#/components/schemas/IssueRow" } }
        "400": { $ref: "#/components/responses/BadSearch" }
  /issues/detail:
    get:
      operationId: getIssue
      summary: One issue with its events over time and the requests it happened in.
      description: With `q`, its series and requests are those within the search (since:, until:); without it, all of them.
      parameters:
        - { name: fingerprint, in: query, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/q" }
      responses:
        "200":
          description: The issue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueDetail" }
        "400": { $ref: "#/components/responses/BadSearch" }
        "404": { $ref: "#/components/responses/NotFound" }
  /counts:
    get:
      operationId: counts
      summary: Navigation badges.
      parameters:
        - $ref: "#/components/parameters/service"
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Counts" }
  /capabilities:
    get:
      operationId: capabilities
      summary: What the console's backend can do beyond the store.
      description: >-
        The agent answers none: an app that serves the console on its own origin answers what it adds, such as
        running EXPLAIN on its database. The console shows those features only where they work.
      responses:
        "200":
          description: Capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
  /store:
    delete:
      operationId: clearStore
      summary: Delete every stored trace, log, query, email and issue.
      description: >-
        A DELETE, so another site can't send it without a CORS preflight, which the console never allows.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                additionalProperties: false
                properties:
                  deleted: { type: integer, description: How many traces were deleted. }
  /values:
    get:
      operationId: knownValues
      summary: Distinct routes, loggers, database aliases and extra= keys, for filter menus and hints.
      parameters:
        - $ref: "#/components/parameters/service"
      responses:
        "200":
          description: Known values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownValues" }
  /search:
    get:
      operationId: searchSpec
      summary: The search fields of every resource (the same data as schema/search.json).
      responses:
        "200":
          description: Fields per resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchSpec" }
  /users:
    get:
      operationId: searchUsers
      summary: Users to switch to (development only, from this machine).
      parameters:
        - { name: q, in: query, description: Part of the username., schema: { type: string } }
      responses:
        "200":
          description: Up to 20 users, by username.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                additionalProperties: false
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/NotLocal" }
  /users/me:
    get:
      operationId: currentUser
      summary: The user logged in to this browser session.
      responses:
        "200":
          description: The user, or null when anonymous.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "403": { $ref: "#/components/responses/NotLocal" }
  /users/switch:
    post:
      operationId: switchUser
      summary: Log this browser session in as another user, or out (development only, from this machine).
      description: Needs the X-Tracepanel header and a same-origin request, so another site can't trigger it.
      parameters:
        - { name: X-Tracepanel, in: header, required: true, schema: { type: string, enum: ["1"] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              additionalProperties: false
              properties:
                user_id: { type: [string, integer, "null"], description: "The user's primary key; null logs out." }
      responses:
        "200":
          description: Now logged in as this user (null when logged out); the session cookie is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "403": { $ref: "#/components/responses/NotLocal" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    service:
      name: service
      in: query
      description: Only what this app (service.name) recorded; every app when left out.
      schema: { type: string }
    q:
      name: q
      in: query
      description: 'Search query: free text plus key:value filters, e.g. route:/api/* status>=500 "timed out".'
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    before:
      name: before
      in: query
      description: The `next` cursor of the previous page.
      schema: { type: integer }
  responses:
    NotFound:
      description: Nothing with that id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotLocal:
      description: User switching is only for requests from this machine (or INTERNAL_IPS) and from the page itself.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadSearch:
      description: The search can't be run; `error` explains it to the user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { type: string }
    Cursor:
      description: Pass as `before` for the next page; null on the last one.
      type: [integer, "null"]
    Time:
      description: Unix epoch microseconds (UTC).
      type: integer
    Duration:
      description: Microseconds.
      type: integer
      minimum: 0
    IssueKind:
      type: string
      enum: [n+1, duplicates, slow-sql, slow-http, slow-call, error, long-transaction, in-transaction, htmx, queue-wait, blocking-call, large-result]
    TraceSummary:
      type: object
      description: A trace without its document, as in lists.
      additionalProperties: false
      required: [id, kind, name, start, duration, status, http_status, method, path, route, view, user_id, queries,
        db_time, issues, errors, logs, mails, issue_kinds, db_aliases, cache_aliases, task_state, htmx]
      properties:
        id: { type: string }
        kind: { type: string, enum: [http, task, command, websocket, rpc, page] }
        name: { type: string }
        start: { $ref: "#/components/schemas/Time" }
        duration: { $ref: "#/components/schemas/Duration" }
        status: { type: string, enum: [ok, error] }
        http_status: { type: [integer, "null"] }
        method: { type: [string, "null"] }
        path: { type: [string, "null"] }
        route: { type: [string, "null"] }
        view: { type: [string, "null"] }
        user_id: { type: [string, "null"] }
        queries: { type: integer }
        db_time: { $ref: "#/components/schemas/Duration" }
        issues: { type: integer }
        errors: { type: integer }
        logs: { type: integer }
        mails: { type: integer }
        issue_kinds: { type: array, items: { $ref: "#/components/schemas/IssueKind" } }
        db_aliases: { type: array, items: { type: string } }
        cache_aliases: { type: array, items: { type: string } }
        task_state:
          type: [string, "null"]
          enum: [success, failure, retry, null]
          description: How a Celery task run ended; null for requests and commands.
        htmx:
          type: [string, "null"]
          enum: [request, boosted, null]
          description: Sent by htmx (HX-Request); boosted when a boosted link or form loaded a whole page.
    LogRow:
      type: object
      additionalProperties: false
      required: [id, trace_id, time, level, logger, message, exception, attrs, span_id, spans, trace_kind, trace_htmx,
        trace_name, method, path, http_status, user_id, service]
      properties:
        id: { type: integer }
        trace_id: { type: string }
        time: { $ref: "#/components/schemas/Time" }
        level: { type: string, enum: [debug, info, warning, error, critical] }
        logger: { type: string }
        message: { type: string }
        exception: { type: [string, "null"] }
        attrs: { $ref: "#/components/schemas/Attrs" }
        span_id: { type: [string, "null"], description: The span it was logged in; null outside every span. }
        spans:
          type: array
          description: >-
            The span it was logged in and the spans around it, innermost first, up to the trace's own (left out).
          items:
            type: object
            additionalProperties: false
            required: [kind, system, name]
            properties:
              kind: { type: string }
              system: { type: string, description: "The system a call is to (kafka, sql); a span's kind otherwise." }
              name: { type: string }
        trace_kind: { type: string, enum: [http, task, command, websocket, rpc, page] }
        trace_htmx: { type: [string, "null"], enum: [request, boosted, null], description: As the trace's htmx. }
        trace_name: { type: string }
        method: { type: [string, "null"] }
        path: { type: [string, "null"] }
        http_status: { type: [integer, "null"] }
        user_id: { type: [string, "null"] }
        service: { type: string, description: The app that recorded it (its trace's service.name). }
    Attrs:
      description: Namespaced attributes; values are scalars or lists of scalars.
      type: object
      additionalProperties:
        anyOf:
          - $ref: "#/components/schemas/Scalar"
          - { type: array, items: { $ref: "#/components/schemas/Scalar" } }
    Scalar:
      type: [string, number, boolean, "null"]
    MailRow:
      type: object
      additionalProperties: false
      required: [trace_id, span_id, time, subject, sender, recipients, sent, html, trace_kind, trace_htmx, method, path,
        trace_name]
      properties:
        trace_id: { type: string }
        span_id: { type: string }
        time: { $ref: "#/components/schemas/Time" }
        subject: { type: string }
        sender: { type: [string, "null"] }
        recipients: { type: array, description: To and cc., items: { type: string } }
        sent: { type: [boolean, "null"], description: "False when the backend refused it; null when unknown." }
        html: { type: boolean }
        trace_kind: { type: string, enum: [http, task, command, websocket, rpc, page] }
        trace_htmx: { type: [string, "null"], enum: [request, boosted, null], description: As the trace's htmx. }
        method: { type: [string, "null"] }
        path: { type: [string, "null"] }
        trace_name: { type: string }
    # CallRow, every system's aggregated calls, has the core fields: key, calls, traces, errors, total, slowest,
    # last_seen, most_per_trace, origin, sample_trace, sample_span.
    CallsSummary:
      type: object
      additionalProperties: false
      required: [calls, traces, most_per_trace, errors, total, p95, hits, misses]
      properties:
        calls: { type: integer }
        traces: { type: integer, description: Traces with any of the calls. }
        most_per_trace: { type: [integer, "null"], description: The most calls in one trace; null with no calls. }
        errors: { type: integer, description: Calls that failed. }
        total: { $ref: "#/components/schemas/Duration" }
        p95: { oneOf: [{ $ref: "#/components/schemas/Duration" }, { type: "null" }], description: Null with no calls. }
        hits: { type: [integer, "null"], description: "A cache's gets that hit; null for other systems." }
        misses: { type: [integer, "null"], description: "A cache's gets that missed; null for other systems." }
    CallRow:
      type: object
      additionalProperties: false
      required: [key, system, family, target, op, template, name, calls, traces, errors, total, slowest, last_seen,
        most_per_trace, origin, sample_trace, sample_span, statement, vendor, hits, misses, via]
      properties:
        key: { type: string, description: "Call id (search traces with call:<key>; for SQL also query:<key>)." }
        system:
          type: string
          description: >-
            What the console lists it under: sql, redis, cache, http, a known datastore, broker or RPC kind (mongodb,
            kafka, grpc…), or the system's own name for any other (neo4j, nats, thrift).
        family: { type: string, enum: [sql, redis, cache, datastore, messaging, rpc, http] }
        target: { type: string, description: "Where it went: a database alias, an instance, a host, a topic, an RPC service." }
        op: { type: string, description: "The operation: SELECT, GET, get, POST, find, publish, an RPC method." }
        template: { type: string, description: "What its repeats share: the SQL fingerprint, a key or path with ids as {id}, a collection." }
        name: { type: string, description: The span's name. }
        calls: { type: integer }
        traces: { type: integer }
        errors: { type: integer, description: Operations that failed. }
        total: { $ref: "#/components/schemas/Duration" }
        slowest: { $ref: "#/components/schemas/Duration" }
        last_seen: { $ref: "#/components/schemas/Time" }
        most_per_trace: { type: integer, description: The most in one trace. }
        origin: { type: [string, "null"], description: The most common line of code making it. }
        sample_trace: { type: string, description: The latest one's trace. }
        sample_span: { type: string, description: The latest one's span. }
        statement: { type: [string, "null"], description: "The operation in full: the SQL statement, the command with its key, the URL." }
        vendor: { type: [string, "null"], description: "SQL: the database; a cache: its backend." }
        hits: { type: [integer, "null"], description: "A cache: gets that found their key." }
        misses: { type: [integer, "null"], description: "A cache: gets that didn't." }
        via: { type: [string, "null"], description: "Redis: direct (the app's call), cache or task (sent for one)." }
    ExplainPlan:
      type: object
      additionalProperties: false
      required: [vendor, alias, analyzed, lines]
      properties:
        vendor: { type: string }
        alias: { type: string }
        analyzed: { type: boolean }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [depth, text, warning]
            properties:
              depth: { type: integer, minimum: 0 }
              text: { type: string }
              warning: { type: [string, "null"] }
    EndpointRow:
      type: object
      additionalProperties: false
      required: [method, route, calls, p50, p95, total, avg_queries, with_issues, errors, last_seen, graphql_operations]
      properties:
        method: { type: string }
        route: { type: string }
        calls: { type: integer }
        p50: { $ref: "#/components/schemas/Duration" }
        p95: { $ref: "#/components/schemas/Duration" }
        total: { $ref: "#/components/schemas/Duration" }
        avg_queries: { type: number }
        with_issues: { type: integer }
        errors: { type: integer }
        last_seen: { $ref: "#/components/schemas/Time" }
        graphql_operations:
          type: integer
          description: Distinct GraphQL operations served by this endpoint (0 for plain HTTP).
    StatsSummary:
      type: object
      additionalProperties: false
      required: [calls, errors, slow, p50, p75, p90, p95, p99, max, avg_queries, avg_db_time, with_issues, first_seen,
        last_seen]
      properties:
        calls: { type: integer }
        errors: { type: integer }
        slow: { type: integer }
        p50: { $ref: "#/components/schemas/Duration" }
        p75: { $ref: "#/components/schemas/Duration" }
        p90: { $ref: "#/components/schemas/Duration" }
        p95: { $ref: "#/components/schemas/Duration" }
        p99: { $ref: "#/components/schemas/Duration" }
        max: { $ref: "#/components/schemas/Duration" }
        avg_queries: { type: number }
        avg_db_time: { $ref: "#/components/schemas/Duration" }
        with_issues: { type: integer }
        first_seen: { $ref: "#/components/schemas/Time" }
        last_seen: { $ref: "#/components/schemas/Time" }
    SeriesBucket:
      type: object
      additionalProperties: false
      required: [start, end, calls, errors, slow, p50, p95]
      properties:
        start: { $ref: "#/components/schemas/Time" }
        end: { $ref: "#/components/schemas/Time" }
        calls: { type: integer }
        errors: { type: integer }
        slow: { type: integer }
        p50: { type: [integer, "null"] }
        p95: { type: [integer, "null"] }
    HistogramBucket:
      type: object
      additionalProperties: false
      required: [from, to, count]
      properties:
        from: { $ref: "#/components/schemas/Duration" }
        to: { $ref: "#/components/schemas/Duration" }
        count: { type: integer }
    GroupStats:
      type: object
      required: [calls, errors, p95, slow]
      properties:
        calls: { type: integer }
        errors: { type: integer }
        p95: { $ref: "#/components/schemas/Duration" }
        slow: { type: integer }
    KindStats:
      allOf:
        - $ref: "#/components/schemas/GroupStats"
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [http, task, command, websocket, rpc, page] }
      unevaluatedProperties: false
    OperationStats:
      description: 'One operation: a trace kind plus name, e.g. http "GET /posts/<int:pk>/".'
      allOf:
        - $ref: "#/components/schemas/GroupStats"
        - type: object
          required: [kind, name, method, route, view]
          properties:
            kind: { type: string, enum: [http, task, command, websocket, rpc, page] }
            name: { type: string }
            method: { type: [string, "null"], description: For requests. }
            route: { type: [string, "null"], description: For requests. }
            view: { type: [string, "null"], description: "For WebSocket events: the consumer, which names their group." }
      unevaluatedProperties: false
    TracesOverview:
      type: object
      additionalProperties: false
      required: [summary, series, histogram, slow_threshold, kinds, slowest, failing]
      properties:
        summary:
          oneOf:
            - $ref: "#/components/schemas/StatsSummary"
            - { type: "null", description: No trace matches. }
        series: { type: array, items: { $ref: "#/components/schemas/SeriesBucket" } }
        histogram: { type: array, items: { $ref: "#/components/schemas/HistogramBucket" } }
        slow_threshold: { $ref: "#/components/schemas/Duration" }
        kinds: { type: array, items: { $ref: "#/components/schemas/KindStats" } }
        slowest: { type: array, description: Highest p95 first., items: { $ref: "#/components/schemas/OperationStats" } }
        failing: { type: array, description: Most errors first., items: { $ref: "#/components/schemas/OperationStats" } }
    IssueGroup:
      type: object
      required: [fingerprint, fingerprint_version, kind, title, culprit, hint, occurrences, first_seen, last_seen,
        last_trace_id]
      properties:
        fingerprint: { type: string, pattern: "^[0-9a-f]{16}$" }
        fingerprint_version: { type: integer }
        kind: { $ref: "#/components/schemas/IssueKind" }
        title: { type: string }
        culprit: { type: [string, "null"] }
        hint: { type: [string, "null"] }
        occurrences: { type: integer, description: Every time it happened, its traces rotated out of the store included. }
        stored: { type: integer, description: "How many of its traces the store still holds: 0 when all rotated out." }
        first_seen: { $ref: "#/components/schemas/Time" }
        last_seen: { $ref: "#/components/schemas/Time" }
        last_trace_id: { type: string }
    IssueRow:
      allOf:
        - $ref: "#/components/schemas/IssueGroup"
        - type: object
          required: [endpoints]
          properties:
            endpoints: { type: array, description: '"METHOD route" of the requests it happened in.', items: { type: string } }
      unevaluatedProperties: false
    IssueDetail:
      allOf:
        - $ref: "#/components/schemas/IssueGroup"
        - type: object
          required: [endpoints, series, traces]
          properties:
            endpoints: { type: array, items: { type: string } }
            series: { type: array, items: { $ref: "#/components/schemas/SeriesBucket" } }
            traces: { type: array, description: Newest first., items: { $ref: "#/components/schemas/TraceSummary" } }
      unevaluatedProperties: false
    EndpointIssue:
      allOf:
        - $ref: "#/components/schemas/IssueGroup"
        - type: object
          required: [calls]
          properties:
            calls: { type: integer, description: Calls of this endpoint it happened in. }
      unevaluatedProperties: false
    EndpointDetail:
      type: object
      additionalProperties: false
      required: [method, route, summary, series, histogram, issues, slowest, recent]
      properties:
        method: { type: string }
        route: { type: string }
        summary: { $ref: "#/components/schemas/StatsSummary" }
        series: { type: array, items: { $ref: "#/components/schemas/SeriesBucket" } }
        histogram: { type: array, items: { $ref: "#/components/schemas/HistogramBucket" } }
        issues: { type: array, items: { $ref: "#/components/schemas/EndpointIssue" } }
        slowest: { type: array, items: { $ref: "#/components/schemas/TraceSummary" } }
        recent: { type: array, items: { $ref: "#/components/schemas/TraceSummary" } }
    Counts:
      type: object
      additionalProperties: false
      required: [issues, errors, sections]
      properties:
        issues: { type: integer, description: "Issue groups besides errors: N+1, duplicates, slow queries and calls, blocking calls, transactions, htmx." }
        errors: { type: integer, description: Error groups. }
        sections:
          type: object
          description: Stored traces per entry point; the console hides entry points with none.
          additionalProperties: false
          required: [http, graphql, tasks, websockets, jobs, rpc, pages, mails, systems]
          properties:
            http: { type: integer, description: HTTP requests that are not GraphQL operations. }
            graphql: { type: integer }
            tasks: { type: integer }
            websockets: { type: integer }
            jobs: { type: integer, description: Management commands and tracepanel.trace() blocks. }
            rpc: { type: integer, description: "RPC calls served: gRPC and other RPC systems' servers." }
            pages: { type: integer, description: "Pages viewed in a browser." }
            mails: { type: integer, description: "Emails sent: the console hides Emails without any." }
            systems:
              type: array
              description: >-
                The systems with operations, by family then name: the console lists a page for each.
              items:
                type: object
                additionalProperties: false
                required: [system, family, label]
                properties:
                  system: { type: string }
                  label: { type: string, description: "Its name in the console: MongoDB, NATS, Google Pub/Sub, or the system's own." }
                  family: { type: string, enum: [sql, redis, cache, datastore, messaging, rpc, http] }
    Capabilities:
      type: object
      additionalProperties: false
      required: [explain, users]
      properties:
        explain: { type: boolean, description: The app runs EXPLAIN of a recorded query on its database (api/explain). }
        users:
          type: boolean
          description: The app can switch the user this browser is logged in as (api/users, api/users/me, api/users/switch).
    KnownValues:
      type: object
      additionalProperties: false
      required: [route, log_route, logger, db, targets, ops, task, task_system, queue, job, rpc, page, in, span, extra]
      properties:
        task: { type: array, description: Celery task names., items: { type: string } }
        task_system:
          type: array
          description: "What ran the tasks: celery, dramatiq, rq, django, spring, or a broker's listener (rabbitmq, kafka)."
          items: { type: string }
        queue: { type: array, description: Queues tasks ran from., items: { type: string } }
        job: { type: array, description: "Job names: management commands and tracepanel.trace() blocks.", items: { type: string } }
        rpc: { type: array, description: "RPC methods served, Service/Method.", items: { type: string } }
        page: { type: array, description: "Paths of pages viewed in a browser.", items: { type: string } }
        route: { type: array, items: { type: string } }
        log_route: { type: array, description: Routes whose requests logged anything., items: { type: string } }
        logger: { type: array, items: { type: string } }
        db: { type: array, description: Database aliases., items: { type: string } }
        targets:
          type: object
          description: "Each system's targets (as /counts names the systems): {\"mongodb\": [\"shop\"]}."
          additionalProperties: { type: array, items: { type: string } }
        ops:
          type: object
          description: "Each system's operations (as /counts names the systems): {\"mongodb\": [\"find\", \"insert\"]}."
          additionalProperties: { type: array, items: { type: string } }
        in: { type: array, description: "Kinds and systems of the spans records were logged inside.", items: { type: string } }
        span: { type: array, description: "Names of the traces' spans (their roots left out).", items: { type: string } }
        extra: { type: array, description: "extra.* keys seen in logs.", items: { type: string } }
    SearchField:
      type: object
      additionalProperties: false
      required: [type, help]
      properties:
        type: { type: string, enum: [text, number, duration, level, has, time] }
        help: { type: string }
    SearchSpec:
      type: object
      additionalProperties: false
      required: [traces, logs, mails, calls, endpoints, tasks, services, websockets, graphql, jobs, rpc, pages, issues]
      properties:
        tasks: { $ref: "#/components/schemas/SearchFields" }
        services: { $ref: "#/components/schemas/SearchFields" }
        websockets: { $ref: "#/components/schemas/SearchFields" }
        graphql: { $ref: "#/components/schemas/SearchFields" }
        jobs: { $ref: "#/components/schemas/SearchFields" }
        rpc: { $ref: "#/components/schemas/SearchFields" }
        pages: { $ref: "#/components/schemas/SearchFields" }
        traces: { $ref: "#/components/schemas/SearchFields" }
        logs: { $ref: "#/components/schemas/SearchFields" }
        mails: { $ref: "#/components/schemas/SearchFields" }
        calls: { $ref: "#/components/schemas/SearchFields" }
        endpoints: { $ref: "#/components/schemas/SearchFields" }
        issues: { $ref: "#/components/schemas/SearchFields" }
    SearchFields:
      description: 'Field name to its type and help; names ending in ".*" accept any key under that prefix.'
      type: object
      additionalProperties: { $ref: "#/components/schemas/SearchField" }
    User:
      type: object
      additionalProperties: false
      required: [id, username, name, email, is_staff, is_superuser]
      properties:
        id: { type: string }
        username: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        is_staff: { type: boolean }
        is_superuser: { type: boolean }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - { type: "null", description: Anonymous. }
    TaskRow:
      type: object
      additionalProperties: false
      required: [task, system, runs, failures, retries, p50, p95, total, wait_p50, wait_p95, avg_queries, with_issues,
        queues, last_seen]
      properties:
        task: { type: string, description: Dotted task name. }
        system: { type: string, description: "task.system: the queue that ran it (celery, django)." }
        runs: { type: integer }
        failures: { type: integer }
        retries: { type: integer, description: Runs that ended in a retry. }
        p50: { $ref: "#/components/schemas/Duration" }
        p95: { $ref: "#/components/schemas/Duration" }
        total: { $ref: "#/components/schemas/Duration" }
        wait_p50: { type: [integer, "null"], description: Time in the queue before a worker took it (microseconds). }
        wait_p95: { type: [integer, "null"] }
        avg_queries: { type: number }
        with_issues: { type: integer }
        queues: { type: array, items: { type: string } }
        last_seen: { $ref: "#/components/schemas/Time" }
    GraphqlRow:
      type: object
      additionalProperties: false
      required: [operation, type, name, calls, errors, p50, p95, total, avg_queries, with_issues, last_seen]
      properties:
        operation: { type: string, description: "Type and name: query PostList; an unnamed operation by its root fields, query { posts }." }
        type: { type: [string, "null"], description: query, mutation or subscription. }
        name: { type: [string, "null"], description: "operationName; null for an anonymous operation." }
        calls: { type: integer }
        errors: { type: integer, description: Calls with an error (a resolver exception or a 5xx). }
        p50: { $ref: "#/components/schemas/Duration" }
        p95: { $ref: "#/components/schemas/Duration" }
        total: { $ref: "#/components/schemas/Duration" }
        avg_queries: { type: number }
        with_issues: { type: integer }
        last_seen: { $ref: "#/components/schemas/Time" }
    TraceGroup:
      type: object
      additionalProperties: false
      required: [query, summary, series, histogram, issues, slowest, recent]
      properties:
        query: { type: string, description: The search that names the group. }
        summary: { $ref: "#/components/schemas/StatsSummary" }
        series: { type: array, items: { $ref: "#/components/schemas/SeriesBucket" } }
        histogram: { type: array, items: { $ref: "#/components/schemas/HistogramBucket" } }
        issues: { type: array, items: { $ref: "#/components/schemas/EndpointIssue" } }
        slowest: { type: array, items: { $ref: "#/components/schemas/TraceSummary" } }
        recent: { type: array, items: { $ref: "#/components/schemas/TraceSummary" } }
    JobRow:
      type: object
      additionalProperties: false
      required: [job, source, runs, failures, p50, p95, total, avg_queries, with_issues, last_seen]
      properties:
        job: { type: string, description: "manage.py migrate, or the name given to tracepanel.trace()." }
        source: { type: string, enum: [manage.py, custom] }
        runs: { type: integer }
        failures: { type: integer }
        p50: { $ref: "#/components/schemas/Duration" }
        p95: { $ref: "#/components/schemas/Duration" }
        total: { $ref: "#/components/schemas/Duration" }
        avg_queries: { type: number }
        with_issues: { type: integer }
        last_seen: { $ref: "#/components/schemas/Time" }
    RpcRow:
      type: object
      additionalProperties: false
      required: [rpc, system, calls, failures, p50, p95, total, avg_queries, with_issues, last_seen]
      properties:
        rpc: { type: string, description: "The method, Service/Method: helloworld.Greeter/SayHello." }
        system: { type: [string, "null"], description: "grpc, or another RPC system's name." }
        calls: { type: integer }
        failures: { type: integer }
        p50: { $ref: "#/components/schemas/Duration" }
        p95: { $ref: "#/components/schemas/Duration" }
        total: { $ref: "#/components/schemas/Duration" }
        avg_queries: { type: number }
        with_issues: { type: integer }
        last_seen: { $ref: "#/components/schemas/Time" }
    PageRow:
      type: object
      additionalProperties: false
      description: >-
        A page's view (its load, an SPA's route change) or an action on it (what the user did that called the API:
        a click, a submit; background when nobody did). A page's view comes first, then its actions.
      required: [name, page, action, trigger, count, failures, p50, p95, total, avg_calls, with_issues, last_seen]
      properties:
        name: { type: string, description: "The traces' name, the group's key: /books, or /books › click \"Save\"." }
        page: { type: string, description: "The page's path: /books/42." }
        action: { type: [string, "null"], description: "What the user did: click \"Save\". None for a view." }
        trigger: { type: [string, "null"], description: "load, navigation, click, submit or background." }
        count: { type: integer, description: "Views, or times the action was done." }
        failures: { type: integer, description: Views or actions with an error in the page or a failed call. }
        p50: { $ref: "#/components/schemas/Duration" }
        p95: { $ref: "#/components/schemas/Duration" }
        total: { $ref: "#/components/schemas/Duration" }
        avg_calls: { type: number, description: Requests to the API per view or action. }
        with_issues: { type: integer }
        last_seen: { $ref: "#/components/schemas/Time" }
    GraphqlDetail:
      type: object
      additionalProperties: false
      required: [operation, type, name, document, summary, series, histogram, resolvers, issues, slowest, recent]
      properties:
        operation: { type: string }
        type: { type: [string, "null"] }
        name: { type: [string, "null"] }
        document: { type: [string, "null"], description: The latest query text (whitespace collapsed). }
        summary: { $ref: "#/components/schemas/StatsSummary" }
        series: { type: array, items: { $ref: "#/components/schemas/SeriesBucket" } }
        histogram: { type: array, items: { $ref: "#/components/schemas/HistogramBucket" } }
        resolvers:
          type: array
          description: The project's resolvers in this operation, most time first.
          items: { $ref: "#/components/schemas/ResolverStats" }
        issues: { type: array, items: { $ref: "#/components/schemas/EndpointIssue" } }
        slowest: { type: array, items: { $ref: "#/components/schemas/TraceSummary" } }
        recent: { type: array, items: { $ref: "#/components/schemas/TraceSummary" } }
    ResolverStats:
      type: object
      additionalProperties: false
      required: [field, per_call, total, p95, queries_per_call]
      properties:
        field: { type: string, description: "Type.field, e.g. PostType.author." }
        per_call: { type: number, description: How many times it resolves per operation call (N+1 shows here). }
        total: { $ref: "#/components/schemas/Duration" }
        p95: { $ref: "#/components/schemas/Duration" }
        queries_per_call: { type: number, description: SQL queries it runs per operation call. }
    WebsocketRow:
      type: object
      additionalProperties: false
      required: [consumer, connections, received, delivered, disconnects, errors, p50, p95, total, avg_queries,
        with_issues, paths, last_seen]
      properties:
        consumer: { type: string, description: Dotted consumer class. }
        connections: { type: integer }
        received: { type: integer, description: Frames received from clients. }
        delivered: { type: integer, description: Channel layer messages handled (group_send and send). }
        disconnects: { type: integer }
        errors: { type: integer }
        p50: { $ref: "#/components/schemas/Duration" }
        p95: { $ref: "#/components/schemas/Duration" }
        total: { $ref: "#/components/schemas/Duration" }
        avg_queries: { type: number }
        with_issues: { type: integer }
        paths: { type: array, items: { type: string }, description: Up to five paths seen. }
        last_seen: { $ref: "#/components/schemas/Time" }
    ServiceApp:
      description: The project's own web, workers and commands, each a service of its own.
      type: object
      additionalProperties: false
      required: [service, role, traces, errors, total, last_seen, runtime]
      properties:
        service: { type: string, description: "service.name: the project (the TRACEPANEL service setting)." }
        role: { type: string, description: "web, worker or command." }
        traces: { type: integer, description: Requests, tasks or commands it handled. }
        errors: { type: integer, description: How many of them failed. }
        total: { $ref: "#/components/schemas/Duration" }
        last_seen: { $ref: "#/components/schemas/Time" }
        runtime:
          type: [string, "null"]
          description: 'What runs it, as the SDKs label it: "Python 3.12 · Django 6.0", "Go 1.27".'
    ServiceNode:
      type: object
      additionalProperties: false
      required: [id, kind, system, address, port, namespace, aliases, calls, total, errors, last_seen]
      properties:
        id: { type: string, description: "kind:system/address:port/namespace, e.g. database:postgresql/db:5432/blog." }
        kind: { type: string, enum: [database, cache, mail, queue, http] }
        system: { type: string, description: "postgresql, sqlite, redis, locmem, smtp, console, rabbitmq…" }
        address: { type: [string, "null"], description: Host name, IP or socket path. }
        port: { type: [integer, "null"] }
        namespace:
          type: [string, "null"]
          description: Database name, Redis database number, or the alias of an in-process cache.
        aliases: { type: array, items: { type: string }, description: Django aliases (DATABASES / CACHES) using it. }
        calls: { type: integer, description: Calls made to it (for a broker, tasks published). }
        total: { $ref: "#/components/schemas/Duration" }
        errors: { type: integer }
        last_seen: { $ref: "#/components/schemas/Time" }
    ServiceEdge:
      type: object
      additionalProperties: false
      required: [service, role, peer, direction, traces, calls, total, errors]
      properties:
        service: { type: string }
        role: { type: string }
        peer: { type: string, description: ServiceNode id. }
        direction:
          type: string
          enum: [out, in]
          description: "out: the app calls it; in: a worker takes tasks from this broker."
        traces: { type: integer }
        calls: { type: integer }
        total: { $ref: "#/components/schemas/Duration", description: Time spent in the calls (queue wait for in). }
        errors: { type: integer }
    AppLink:
      description: >-
        One app's calls to another, linked by the W3C trace context the call carried (a trace's `called_by`): from a
        role of one to a role of the other.
      type: object
      additionalProperties: false
      required: [service, role, to_service, to_role, peer, traces, total, errors]
      properties:
        service: { type: string, description: The calling app. }
        role: { type: [string, "null"] }
        to_service: { type: string, description: The app it called. }
        to_role: { type: [string, "null"] }
        peer:
          type: [string, "null"]
          description: The ServiceNode the caller saw it as (its HTTP host, its RPC service), if any.
        traces: { type: integer, description: The called app's traces. }
        total: { $ref: "#/components/schemas/Duration", description: Their time. }
        errors: { type: integer, description: How many of them failed. }
    Snapshot:
      type: object
      additionalProperties: false
      required: [format, agent, created, values, root, traces, related]
      properties:
        format: { type: integer, description: "The snapshot's layout version." }
        agent: { type: string, description: The agent's version that made it. }
        created: { type: integer, description: When it was made, in microseconds since the epoch. }
        values: { type: boolean, description: Whether what stays local was kept. }
        root: { type: string, description: The id of the trace it was made from. }
        traces:
          type: object
          description: The trace and those linked to it (at most 100), by id.
          additionalProperties: { $ref: "trace.schema.json" }
        related:
          type: object
          description: The links of each trace in `traces`, by id.
          additionalProperties: { $ref: "#/components/schemas/Related" }
    Related:
      type: object
      additionalProperties: false
      required: [enqueued_by, enqueued, connection, connection_events, sent_by, delivered, called_by, calls, via]
      properties:
        enqueued_by:
          description: The trace that enqueued this task.
          oneOf:
            - $ref: "#/components/schemas/TraceSummary"
            - { type: "null" }
        enqueued:
          type: array
          description: Tasks this trace enqueued, oldest first.
          items: { $ref: "#/components/schemas/TraceSummary" }
        connection:
          description: The connect event of this WebSocket event's connection.
          oneOf:
            - $ref: "#/components/schemas/TraceSummary"
            - { type: "null" }
        connection_events:
          type: array
          description: For a connect event, the later events of the connection, oldest first (up to 100).
          items: { $ref: "#/components/schemas/TraceSummary" }
        sent_by:
          description: The trace whose channel layer message this event handles.
          oneOf:
            - $ref: "#/components/schemas/TraceSummary"
            - { type: "null" }
        delivered:
          type: array
          description: Events that handled the channel layer messages this trace sent, oldest first.
          items: { $ref: "#/components/schemas/TraceSummary" }
        called_by:
          description: The trace, in another app, whose call this trace served (by the W3C trace context it carried).
          oneOf:
            - $ref: "#/components/schemas/TraceSummary"
            - { type: "null" }
        calls:
          type: array
          description: The traces other apps served for this trace's calls, oldest first.
          items: { $ref: "#/components/schemas/TraceSummary" }
        via:
          type: object
          description: >-
            For the traces in enqueued, connection_events, delivered and calls: the span of this trace each came from
            (the task.enqueue, channel.send or outgoing call span), by trace id. The call tree shows a task under the
            span that enqueued it, and a call's trace under the call.
          additionalProperties: { type: string }
