packages:
  - packages/*
  - apps/*
  # The console in a browser against a real agent (Playwright).
  - e2e
# New releases stay out for 48 hours before they resolve here (docs: pnpm
# minimumReleaseAge). Same window the fallow audit and Renovate respect, and
# the same window the team already runs locally.
minimumReleaseAge: 2880
# esbuild (vite's bundler) checks its platform binary after install, and
# lefthook's pruned-launcher postinstall wires the platform binary: the two
# dependencies allowed to run build scripts.
allowBuilds:
  esbuild: true
  lefthook: true
# pnpm 12 asks when a package bundles agent skills. The team keeps one skills
# home outside this repo, hand-vendored and pinned, so bundled skills stay
# denied rather than linked.
permissions:
  fallow:
    skills: false
